<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Osteria Lume</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf7f1;color:#2a211c;font:16px system-ui,sans-serif}</style>
  <script>
    // Random assignment: each visitor is sent to version A or B (50/50).
    // The choice is remembered on that browser so a refresh shows the same version.
    // For your own testing only: add ?v=A or ?v=B to the link (not remembered).
    (function () {
      var pages = { A: "p/7f3a.html", B: "p/c91e.html" };
      var forced = new URLSearchParams(location.search).get("v");
      var g = (forced === "A" || forced === "B") ? forced : null;
      if (!g) {
        try { g = localStorage.getItem("lume_group"); } catch (e) {}
        if (g !== "A" && g !== "B") {
          g = Math.random() < 0.5 ? "A" : "B";
          try { localStorage.setItem("lume_group", g); } catch (e) {}
        }
      }
      location.replace(pages[g]);
    })();
  </script>
</head>
<body>
  <p>Loading&hellip; <noscript>Please <a href="p/7f3a.html">continue here</a>.</noscript></p>
</body>
</html>
